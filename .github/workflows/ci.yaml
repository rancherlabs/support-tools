name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  detect_secrets:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Build baseline from origin/master
        run: |
          git fetch origin master
          git worktree add /tmp/main-checkout origin/master
          # Copy baseline config so detect-secrets uses consistent plugins/filters
          cp .secrets.baseline /tmp/main-checkout/
          cd /tmp/main-checkout
          detect-secrets scan \
            --exclude-files '\.secrets\.baseline' \
            . > /tmp/main-baseline.json
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/main-checkout
          git worktree prune

      - name: Scan merge commit and compare
        run: |
          detect-secrets scan \
            --exclude-files '\.secrets\.baseline' \
            > /tmp/pr-scan.json
          python3 - <<'EOF'
          import json, sys

          with open('/tmp/pr-scan.json') as f:
              pr_scan = json.load(f)
          with open('/tmp/main-baseline.json') as f:
              main_baseline = json.load(f)

          # Hashes from origin/master's current code
          main_hashes = {
              s['hashed_secret']
              for secrets in main_baseline.get('results', {}).values()
              for s in secrets
          }

          # Hashes from the committed baseline — covers legacy reviewed findings
          # that master may have since diverged from, or the first-time setup
          try:
              with open('.secrets.baseline') as f:
                  committed = json.load(f)
              committed_hashes = {
                  s['hashed_secret']
                  for secrets in committed.get('results', {}).values()
                  for s in secrets
              }
          except (FileNotFoundError, json.JSONDecodeError):
              committed_hashes = set()

          # Union: known-safe set covers both current master + legacy reviewed state
          baseline_hashes = main_hashes | committed_hashes

          new_findings = []
          for path, secrets in pr_scan.get('results', {}).items():
              for s in secrets:
                  if s['hashed_secret'] not in baseline_hashes:
                      new_findings.append((path, s))

          if new_findings:
              print("UNREVIEWED SECRETS introduced by this PR:")
              with open('/tmp/secrets_report.md', 'w') as out:
                  out.write("### 🚨 Unreviewed Secrets Detected\n\n")
                  out.write("The following secrets were introduced in this PR and are not present in the `.secrets.baseline` file:\n\n")
                  out.write("| File Path | Line | Secret Type |\n")
                  out.write("|---|---|---|\n")
                  for path, s in sorted(new_findings, key=lambda x: (x[0], x[1].get('line_number', 0))):
                      print(f"  {path}:{s['line_number']} [{s['type']}]")
                      out.write(f"| `{path}` | `{s['line_number']}` | {s['type']} |\n")
              sys.exit(1)

          pr_total = sum(len(v) for v in pr_scan.get('results', {}).values())
          print(f"All {pr_total} finding(s) are in the baseline — OK")
          EOF

      - name: Comment PR on Failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/secrets_report.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/secrets_report.md
          fi

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run shellcheck and annotate PR
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git fetch origin ${{ github.event.pull_request.base.ref }}
            BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          else
            BASE_REF="HEAD^"
          fi

          # Get list of added/modified .sh files
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR $BASE_REF...HEAD | grep '\.sh$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No shell scripts changed. Skipping shellcheck."
            exit 0
          fi

          echo "Running shellcheck on the following files:"
          echo "$CHANGED_FILES"

          # Use jq to parse the JSON output of shellcheck and translate it into native GitHub Actions annotations
          # This automatically highlights warnings/errors directly inline on the PR code tab
          echo "$CHANGED_FILES" | xargs shellcheck -f json | jq -r '.[] | "::\(if .level == "error" then "error" elif .level == "warning" then "warning" else "notice" end) file=\(.file),line=\(.line),col=\(.column),title=ShellCheck \(.code)::\(.message)"'
          
          # Rerun normally to print the human-readable output and fail the job if errors exist
          echo "$CHANGED_FILES" | xargs shellcheck
